name: iOS launch smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'platforms/ios/**'
      - '.github/workflows/ios-smoke.yml'

jobs:
  launch:
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Xcode project
        working-directory: platforms/ios/ios
        run: |
          brew untap aws/tap || true
          brew install xcodegen
          xcodegen generate

      - name: Run feature tests and launch the app on the latest simulator
        working-directory: platforms/ios/ios
        run: |
          xcodebuild -list -project KumoneIOS.xcodeproj
          SIMULATOR_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using iPhone simulator: $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 120 \
            -derivedDataPath smoke-build \
            -parallel-testing-enabled NO \
            -skip-testing:KumoneIOSUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" smoke-build/Build/Products/Debug-iphonesimulator/iMusic.app
          xcrun simctl launch "$SIMULATOR_ID" com.jiajia2222.imusic.ios
