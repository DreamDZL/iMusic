name: iOS unsigned release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: xcode-27
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Xcode project
        working-directory: platforms/ios/ios
        run: |
          brew untap aws/tap || true
          brew install xcodegen
          xcodegen generate

      - name: Run feature tests
        working-directory: platforms/ios/ios
        run: |
          destination_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next((device["udid"] for runtime in devices.values() for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone")), ""))')"
          if [[ -z "$destination_id" ]]; then
            echo "No available iPhone simulator was found" >&2
            exit 1
          fi
          # Restart the simulator so stale Accessibility/XCTest services do not
          # prevent the UI test runner from initializing.
          xcrun simctl shutdown "$destination_id" || true
          xcrun simctl boot "$destination_id"
          xcrun simctl bootstatus "$destination_id" -b
          xcodebuild test \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -destination "platform=iOS Simulator,id=$destination_id" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -derivedDataPath build/test-derived \
            -skip-testing:KumoneIOSUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' platforms/ios/ios/Config/Shared.xcconfig | head -n 1 | tr -d '[:space:]')"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid marketing version: $version" >&2
            exit 1
          fi

          echo "marketing_version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building iMusic $version ($GITHUB_RUN_NUMBER)"

      - name: Build unsigned iOS app
        working-directory: platforms/ios/ios
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build_number }}
        run: |
          xcodebuild \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Verify app bundle version
        working-directory: platforms/ios/ios
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: |
          app="build/Build/Products/Release-iphoneos/iMusic.app"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          echo "Bundle version: $actual ($build)"
          if [[ "$actual" != "$EXPECTED_VERSION" ]]; then
            echo "Bundle version mismatch: expected $EXPECTED_VERSION, got $actual" >&2
            exit 1
          fi

      - name: Package unsigned IPA
        working-directory: platforms/ios/ios
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/iMusic.app dist/Payload/iMusic.app
          if find dist/Payload -name '*.appex' -print -quit | grep -q .; then
            echo "The iMusic IPA must not contain a custom Live Activity or widget extension" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent dist/Payload dist/iMusic-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iMusic-ios-unsigned
          path: platforms/ios/ios/dist/iMusic-unsigned.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: platforms/ios/ios/dist/iMusic-unsigned.ipa
