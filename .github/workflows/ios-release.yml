name: iOS unsigned release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - 'platforms/ios/**'
      - '.github/workflows/ios-release.yml'

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Xcode project
        working-directory: platforms/ios/ios
        run: |
          set -euo pipefail
          brew untap aws/tap || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate

      - name: Run feature tests
        working-directory: platforms/ios/ios
        run: |
          destination_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next((device["udid"] for runtime in devices.values() for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone")), ""))')"
          if [[ -z "$destination_id" ]]; then
            echo "No available iPhone simulator was found" >&2
            exit 1
          fi
          # Restart the simulator so stale Accessibility/XCTest services do not
          # prevent the UI test runner from initializing.
          xcrun simctl shutdown "$destination_id" || true
          xcrun simctl boot "$destination_id"
          xcrun simctl bootstatus "$destination_id" -b
          xcodebuild test \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -destination "platform=iOS Simulator,id=$destination_id" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -derivedDataPath build/test-derived \
            -skip-testing:KumoneIOSUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS 27 UI regression tests before tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: platforms/ios/ios
        run: |
          set -euo pipefail
          mkdir -p build
          destination_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next((device["udid"] for runtime, entries in devices.items() if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-27") for device in entries if device.get("isAvailable") and device["name"].startswith("iPhone")), ""))')"
          if [[ -z "$destination_id" ]]; then
            echo "No available iPhone simulator with the iOS 27 runtime was found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl shutdown "$destination_id" || true
          xcrun simctl boot "$destination_id"
          xcrun simctl bootstatus "$destination_id" -b
          xcodebuild test \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -destination "platform=iOS Simulator,id=$destination_id" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -derivedDataPath build/tag-ui-derived \
            -resultBundlePath build/tag-ui-tests.xcresult \
            -only-testing:KumoneIOSUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload tagged UI regression results
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: ios-tag-ui-test-results
          path: platforms/ios/ios/build/tag-ui-tests.xcresult
          if-no-files-found: warn

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' platforms/ios/ios/Config/Shared.xcconfig | head -n 1 | tr -d '[:space:]')"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid marketing version: $version" >&2
            exit 1
          fi

          echo "marketing_version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building iMusic $version ($GITHUB_RUN_NUMBER)"

      - name: Build unsigned iOS app
        working-directory: platforms/ios/ios
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build_number }}
        run: |
          xcodebuild \
            -project KumoneIOS.xcodeproj \
            -scheme KumoneIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Verify app bundle version
        working-directory: platforms/ios/ios
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: |
          app="build/Build/Products/Release-iphoneos/iMusic.app"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          echo "Bundle version: $actual ($build)"
          if [[ "$actual" != "$EXPECTED_VERSION" ]]; then
            echo "Bundle version mismatch: expected $EXPECTED_VERSION, got $actual" >&2
            exit 1
          fi
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          if [[ "$bundle_id" != "com.jiajia2222.imusic.ios" ]]; then
            echo "Bundle identifier mismatch: $bundle_id" >&2
            exit 1
          fi
          promotion="$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$app/Info.plist")"
          if [[ "$promotion" != "true" ]]; then
            echo "Built app is missing its ProMotion timing opt-in" >&2
            exit 1
          fi

      - name: Package unsigned IPA
        working-directory: platforms/ios/ios
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/iMusic.app dist/Payload/iMusic.app
          if find dist/Payload -name '*.appex' -print -quit | grep -q .; then
            echo "The iMusic IPA must not contain a custom Live Activity or widget extension" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent dist/Payload "dist/imusic_ios_${RELEASE_VERSION}.ipa"

      - name: Inspect IPA contents
        working-directory: platforms/ios/ios
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.marketing_version }}
        run: |
          set -euo pipefail
          unzip -l "dist/imusic_ios_${RELEASE_VERSION}.ipa" | grep -F 'Payload/iMusic.app/' >/dev/null
          if unzip -l "dist/imusic_ios_${RELEASE_VERSION}.ipa" | grep -E '\.appex/' >/dev/null; then
            echo 'Unexpected app extension in IPA' >&2
            exit 1
          fi
          # Validate the device executable as well as ZIP filenames. This is
          # structural validation, not a claim of provisioning/installability.
          python3 ../../../scripts/verify_ios_ipa.py \
            "dist/imusic_ios_${RELEASE_VERSION}.ipa" \
            --expected-version "$RELEASE_VERSION" \
            --expected-bundle-id com.jiajia2222.imusic.ios

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: iMusic-ios-unsigned
          path: platforms/ios/ios/dist/imusic_ios_${{ steps.version.outputs.marketing_version }}.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: platforms/ios/ios/dist/imusic_ios_${{ steps.version.outputs.marketing_version }}.ipa
